<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>줄넘기 기록장</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1d2433;--sub:#6b7488;--pri:#2f6fed;--pri2:#e8effe;--ok:#12a36b;--bad:#e5484d;--line:#e3e8f0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10141c;--card:#1a202c;--ink:#e8ecf4;--sub:#9aa4b8;--pri:#5b8cff;--pri2:#232c42;--line:#2a3345;--ok:#3ccf91;--bad:#ff6b70;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
header .row{display:flex;gap:6px;flex-wrap:wrap}
main{max-width:820px;margin:0 auto;padding:12px 16px}
button{font:inherit;border:0;border-radius:10px;cursor:pointer;background:var(--pri2);color:var(--pri);padding:9px 13px;font-weight:600}
button:active{transform:scale(.96)}
button.pri{background:var(--pri);color:#fff}
header{color:#fff}header button{background:rgba(255,255,255,.2);color:#fff;padding:7px 11px;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.tab{white-space:nowrap;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.bar .sp{flex:1}
.bus{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
.bu{white-space:nowrap;background:var(--card);color:var(--ink);border:2px solid var(--line);padding:8px 14px}
.bu.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.bu small{opacity:.7;font-weight:400}
.dbar{background:var(--card);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.dbar select,.dbar input{font:inherit;padding:6px;border:2px solid var(--line);border-radius:8px;color:var(--ink);background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.card h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.card h3 small{color:var(--sub);font-weight:400;font-size:12px}
.num{width:100%;font-size:52px;font-weight:800;text-align:center;border:0;background:transparent;color:var(--ink);padding:0;margin:2px 0 8px}
.num:focus{outline:2px solid var(--pri);border-radius:8px}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btns button{padding:12px 0;font-size:17px}
.btns .big{grid-column:span 2;background:var(--pri);color:#fff;font-size:20px}
.btns .neg{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
.best{font-size:12px;color:var(--ok);text-align:center;min-height:16px;margin-top:6px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--pri2);color:var(--pri)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:inherit;font-weight:700}
td:first-child{background:var(--card)}
.wrap{overflow-x:auto;border-radius:12px}
.timer{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.timer .t{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;min-width:110px;text-align:center}
.timer .t.run{color:var(--ok)}.timer .t.end{color:var(--bad)}
.timer .pre{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.timer .pre button.on{background:var(--pri);color:#fff}
.hint{color:var(--sub);font-size:13px;margin:8px 2px}
dialog{background:var(--card);color:var(--ink);border:0;border-radius:16px;padding:18px;max-width:420px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 10px;font-size:18px}
dialog .col{display:flex;flex-direction:column;gap:8px}
input[type=text],input[type=date],input[type=number],input[type=file]{color:var(--ink);background:var(--card)}
input[type=text]{font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;width:100%}
textarea{background:var(--card);color:var(--ink);width:100%;height:150px;font:inherit;padding:8px;border:2px solid var(--line);border-radius:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media print{header,.tabs,.bar,.hint,#view-kid{display:none!important}#view-sum{display:block!important}}
</style>
</head>
<body>
<header>
  <h1>🪢 줄넘기 기록장</h1>
  <div class="row">
    <button onclick="openShare()">💾 저장/공유</button>
    <button onclick="openImport()">📂 불러오기</button>
  </div>
</header>
<main>
  <div class="dbar">
    <b>📅 측정일</b>
    <input type="date" id="date">
    <select id="dsel" title="지난 측정일 불러오기"></select>
    <button onclick="$('date').value=today();render()">오늘로</button>
  </div>
  <div class="bus" id="bus"></div>
  <div class="bar">
    <button onclick="showView('kid')" id="b-kid" class="pri">측정</button>
    <button onclick="showView('sum')" id="b-sum">부 전체 표</button>
    <button onclick="showView('his')" id="b-his">기록 비교</button>
  </div>

  <div id="view-kid">
    <div class="timer">
      <div class="t" id="tdisp">00:30</div>
      <div class="pre" id="tpre"></div>
      <button class="pri" id="tgo" onclick="timerToggle()">▶ 시작</button>
      <button onclick="timerReset()">↺</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="bar">
      <button onclick="addKid()">➕ 아이 추가</button>
      <button onclick="bulkKids()">👥 이름 일괄 추가</button>
      <button onclick="renameKid()">✏️ 이름 수정</button>
      <button onclick="delKid()">🗑 아이 삭제</button>
      <span class="sp"></span>
      <button onclick="editSkills()">⚙️ 기술 목록</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="hint">숫자를 눌러 직접 입력할 수도 있어요. 기록은 이 기기에 자동 저장됩니다.</p>
  </div>

  <div id="view-his" style="display:none">
    <div class="tabs" id="htabs"></div>
    <div class="wrap"><table id="his"></table></div>
    <p class="hint">날짜별로 이 아이의 기술 기록을 비교해요. 이전 측정보다 늘면 ▲로 표시돼요.</p>
  </div>

  <div id="view-sum" style="display:none">
    <div class="wrap"><table id="sum"></table></div>
    <p class="hint">표시된 값은 선택한 측정일의 기록입니다. 🏆 = 그 기술 최고 기록(전체 날짜 기준)</p>
  </div>
</main>

<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
const KEY='jumprope-v1';
const DEF_SKILLS=['양발모아뛰기','번갈아뛰기','달리기뛰기','엇갈아뛰기(X)','이중뛰기','뒤로뛰기','옆흔들기'];
let S; // {kids:[{id,name}], skills:[], rec:{date:{kidId:{skill:n}}}, cur:id}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,8);

function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!S||!S.kids){S={bu:1,kids:[],skills:[...DEF_SKILLS],rec:{}};}
  for(const k of S.kids)if(!k.bu)k.bu=1;
  if(!S.bu)S.bu=1;
  if(!kidsOf().find(k=>k.id===S.cur))S.cur=kidsOf()[0]?.id;
}
const kidsOf=(b=S.bu)=>S.kids.filter(k=>k.bu===b);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

const date=()=>$('date').value||today();
function get(kid,sk,d=date()){return ((S.rec[d]||{})[kid]||{})[sk]||0}
function set(kid,sk,n){
  n=Math.max(0,Math.round(n)||0);const d=date();
  S.rec[d]=S.rec[d]||{};S.rec[d][kid]=S.rec[d][kid]||{};
  if(n===0)delete S.rec[d][kid][sk];else S.rec[d][kid][sk]=n;
  save();
}
function best(kid,sk){let m=0;for(const d in S.rec){m=Math.max(m,((S.rec[d][kid]||{})[sk])||0)}return m}
function bestAll(sk){let m=0;for(const d in S.rec)for(const k in S.rec[d])m=Math.max(m,S.rec[d][k][sk]||0);return m}

function dates(){return Object.keys(S.rec).filter(d=>Object.values(S.rec[d]).some(r=>Object.keys(r).length)).sort().reverse()}
function render(){
  if(!kidsOf().find(k=>k.id===S.cur))S.cur=kidsOf()[0]?.id;
  $('bus').innerHTML=[1,2,3,4,5,6].map(b=>`<button class="bu ${b===S.bu?'on':''}" onclick="S.bu=${b};save();render()">${b}부 <small>${kidsOf(b).length}명</small></button>`).join('');
  const ds=dates();
  $('dsel').innerHTML='<option value="">지난 측정일 ▾ ('+ds.length+'회)</option>'+ds.map(d=>`<option value="${d}" ${d===date()?'selected':''}>${d}</option>`).join('');
  $('tabs').innerHTML=kidsOf().map(k=>`<button class="tab ${k.id===S.cur?'on':''}" onclick="S.cur='${k.id}';save();render()">${esc(k.name)}</button>`).join('');
  const kid=S.cur;
  $('grid').innerHTML=!kid?`<p>${S.bu}부에 아이가 없어요. ➕ 아이 추가를 눌러 주세요.</p>`:S.skills.map((sk,i)=>{
    const n=get(kid,sk),b=best(kid,sk);
    return `<div class="card"><h3>${esc(sk)}<small>최고 ${b}</small></h3>
      <input class="num" type="number" inputmode="numeric" min="0" value="${n}" onchange="setN(${i},this.value)">
      <div class="btns">
        <button class="neg" onclick="add(${i},-1)">−1</button>
        <button class="neg" onclick="add(${i},-10)">−10</button>
        <button onclick="add(${i},5)">+5</button>
        <button onclick="add(${i},10)">+10</button>
        <button class="big" onclick="add(${i},1)">+1</button>
        <button class="big" style="background:var(--pri2);color:var(--bad)" onclick="setN(${i},0)">0으로</button>
      </div>
      <div class="best">${n&&n>=b?'🏆 최고 기록!':''}</div></div>`}).join('');
  renderSum();renderHis();
}
function renderHis(){
  const ks=kidsOf();
  if(!ks.find(k=>k.id===S.cur))S.cur=ks[0]?.id;
  $('htabs').innerHTML=ks.map(k=>`<button class="tab ${k.id===S.cur?'on':''}" onclick="S.cur='${k.id}';save();render()">${esc(k.name)}</button>`).join('');
  const kid=S.cur;if(!kid){$('his').innerHTML='<tr><td>아이가 없어요</td></tr>';return}
  const ds=Object.keys(S.rec).filter(d=>S.rec[d][kid]&&Object.keys(S.rec[d][kid]).length).sort();
  let h='<tr><th>측정일</th>'+S.skills.map(s=>`<th>${esc(s)}</th>`).join('')+'</tr>';
  if(!ds.length)h+=`<tr><td colspan="${S.skills.length+1}">아직 기록이 없어요</td></tr>`;
  ds.forEach((d,i)=>{h+=`<tr><td>${d}</td>`+S.skills.map(s=>{
    const n=get(kid,s,d),pv=i?get(kid,s,ds[i-1]):0;
    const a=!n?'-':(i&&n>pv?` <small style="color:var(--ok)">▲${n-pv}</small>`:(i&&n<pv?` <small style="color:var(--bad)">▼${pv-n}</small>`:''));
    return `<td>${n||''}${a}</td>`}).join('')+'</tr>'});
  $('his').innerHTML=h;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function add(i,d){const sk=S.skills[i];set(S.cur,sk,get(S.cur,sk)+d);render()}
function setN(i,v){set(S.cur,S.skills[i],parseInt(v)||0);render()}

function renderSum(){
  let h='<tr><th>이름</th>'+S.skills.map(s=>`<th>${esc(s)}</th>`).join('')+'</tr>';
  if(!kidsOf().length)h+=`<tr><td colspan="${S.skills.length+1}">${S.bu}부에 아이가 없어요</td></tr>`;
  for(const k of kidsOf()){
    h+=`<tr><td>${esc(k.name)}</td>`+S.skills.map(s=>{
      const n=get(k.id,s);const t=n&&n>=bestAll(s)?' 🏆':'';
      return `<td>${n||'-'}${t}</td>`}).join('')+'</tr>';
  }
  $('sum').innerHTML=h;
}
function showView(v){
  $('view-kid').style.display=v==='kid'?'':'none';
  $('view-sum').style.display=v==='sum'?'':'none';
  $('view-his').style.display=v==='his'?'':'none';
  $('b-kid').className=v==='kid'?'pri':'';$('b-sum').className=v==='sum'?'pri':'';$('b-his').className=v==='his'?'pri':'';
  render();
}

function askText(title,def,cb){
  const d=$('dlg');
  d.innerHTML=`<h2>${esc(title)}</h2><form class="col" onsubmit="return false"><input type="text" id="askin" value="${esc(def)}" autocomplete="off">
  <div style="display:flex;gap:6px;justify-content:flex-end"><button type="button" onclick="$('dlg').close()">취소</button><button type="submit" class="pri" id="askok">확인</button></div></form>`;
  d.showModal();$('askin').select();
  $('askok').onclick=()=>{const v=$('askin').value.trim();$('dlg').close();if(v)cb(v)};
}
function confirmBox(msg,cb){
  const d=$('dlg');
  d.innerHTML=`<h2>${esc(msg)}</h2><div style="display:flex;gap:6px;justify-content:flex-end"><button onclick="$('dlg').close()">취소</button><button class="pri" id="cfok">삭제</button></div>`;
  d.showModal();$('cfok').onclick=()=>{$('dlg').close();cb()};
}
function bulkKids(){
  const d=$('dlg');
  d.innerHTML=`<h2>${S.bu}부 이름 일괄 추가</h2><div class="col">
    <p class="hint" style="margin:0">한 줄에 한 명씩, 또는 쉼표로 구분해서 붙여넣으세요. 이미 있는 이름은 건너뛰어요.</p>
    <textarea id="bulkta" placeholder="김민수&#10;이서연&#10;박지호"></textarea>
    <div style="display:flex;gap:6px;justify-content:flex-end"><button onclick="$('dlg').close()">취소</button><button class="pri" id="bulkok">추가</button></div></div>`;
  d.showModal();
  $('bulkok').onclick=()=>{
    const names=[...new Set($('bulkta').value.split(/[\n,，、]+/).map(x=>x.trim()).filter(Boolean))];
    let n=0;for(const nm of names){if(kidsOf().some(k=>k.name===nm))continue;S.kids.push({id:uid(),name:nm,bu:S.bu});n++}
    if(!S.cur||!kidsOf().find(k=>k.id===S.cur))S.cur=kidsOf()[0]?.id;
    save();$('dlg').close();render();toast(n+'명 추가했어요');
  };
}
/* 아이 관리 */
function addKid(){
  askText('아이 이름','',n=>{const k={id:uid(),name:n,bu:S.bu};S.kids.push(k);S.cur=k.id;save();render()});
}
function renameKid(){
  const k=S.kids.find(k=>k.id===S.cur);if(!k)return;
  askText('이름 수정',k.name,n=>{k.name=n;save();render()});
}
function delKid(){
  const k=S.kids.find(k=>k.id===S.cur);if(!k)return;
  confirmBox(`'${k.name}'의 모든 기록을 삭제할까요?`,()=>{
  S.kids=S.kids.filter(x=>x.id!==k.id);
  for(const d in S.rec)delete S.rec[d][k.id];
  S.cur=kidsOf()[0]?.id;save();render()});
}

/* 기술 목록 편집 */
function editSkills(){
  const d=$('dlg');
  d.innerHTML=`<h2>기술 목록 편집</h2><div class="col">
    <p class="hint" style="margin:0">한 줄에 기술 하나씩 적어요.</p>
    <textarea id="skta">${esc(S.skills.join('\n'))}</textarea>
    <div style="display:flex;gap:6px;justify-content:flex-end"><button onclick="$('dlg').close()">취소</button><button class="pri" onclick="saveSkills()">저장</button></div></div>`;
  d.showModal();
}
function saveSkills(){
  const l=[...new Set($('skta').value.split('\n').map(s=>s.trim()).filter(Boolean))];
  if(!l.length)return toast('기술을 1개 이상 입력하세요');
  S.skills=l;save();$('dlg').close();render();
}

/* 저장/공유 */
function fname(ext){return `줄넘기기록_${date()}.${ext}`}
function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function csv(allDates){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const rows=[['날짜','부','이름',...S.skills]];
  const ds=allDates?Object.keys(S.rec).sort():[date()];
  for(const d of ds)for(const k of S.kids){
    const r=S.rec[d]?.[k.id];if(!r&&!allDates)continue;if(!r)continue;
    rows.push([d,k.bu+'부',k.name,...S.skills.map(s=>r[s]||0)]);
  }
  if(rows.length===1)for(const k of S.kids)rows.push([date(),k.bu+'부',k.name,...S.skills.map(()=>0)]);
  return '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
}
function textSummary(){
  const l=[`🪢 줄넘기 기록 ${S.bu}부 (${date()})`];
  for(const k of kidsOf()){
    const parts=S.skills.map(s=>[s,get(k.id,s)]).filter(x=>x[1]).map(x=>`${x[0]} ${x[1]}개`);
    l.push(`\n■ ${k.name}\n`+(parts.length?parts.join('\n'):'기록 없음'));
  }
  return l.join('\n');
}
function openShare(){
  const d=$('dlg');
  d.innerHTML=`<h2>저장 / 공유</h2><div class="col">
    <button class="pri" onclick="download(fname('csv'),csv(false),'text/csv')">📊 엑셀(CSV) 저장 – 선택한 측정일 (전체 부)</button>
    <button onclick="download('줄넘기기록_전체.csv',csv(true),'text/csv')">📊 엑셀(CSV) 저장 – 전체 날짜</button>
    <button onclick="download('줄넘기기록_백업.json',JSON.stringify(S,null,1),'application/json')">💾 백업 파일(JSON) 저장</button>
    <button onclick="shareText()">📤 문자/카톡으로 보내기 (텍스트)</button>
    <button onclick="copyText()">📋 텍스트 복사</button>
    <button onclick="copyBackup()">🔑 백업 코드 복사 (다운로드가 안 될 때)</button>
    <button onclick="copyCsv()">📋 표(CSV) 복사 → 엑셀/구글시트에 붙여넣기</button>
    <p class="hint" style="margin:0">파일 저장이 막힌 화면에서는 복사 버튼을 쓰세요. 받는 사람은 <b>불러오기</b>에서 백업 코드를 붙여넣으면 기록이 그대로 옮겨져요.</p>
    <button onclick="$('dlg').close()">닫기</button></div>`;
  d.showModal();
}
async function clip(t){
  try{await navigator.clipboard.writeText(t);toast('복사했어요')}
  catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('복사했어요')}catch(_){toast('복사 실패')}a.remove()}
}
const copyBackup=()=>clip(JSON.stringify(S));
const copyCsv=()=>clip(csv(true).replace('\ufeff',''));
async function shareText(){
  const t=textSummary();
  if(navigator.share){try{await navigator.share({title:'줄넘기 기록',text:t});return}catch(e){if(e.name==='AbortError')return}}
  copyText();
}
async function copyText(){
  const t=textSummary();
  try{await navigator.clipboard.writeText(t);toast('복사했어요')}
  catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('복사했어요')}
}

/* 불러오기 */
function openImport(){
  const d=$('dlg');
  d.innerHTML=`<h2>불러오기</h2><div class="col">
    <p class="hint" style="margin:0">백업 파일(JSON)을 선택하세요.</p>
    <input type="file" id="file" accept=".json,application/json">
    <p class="hint" style="margin:0">또는 복사한 백업 코드를 붙여넣기</p>
    <textarea id="paste" placeholder="백업 코드 붙여넣기" style="height:80px"></textarea>
    <label><input type="radio" name="mode" value="merge" checked> 현재 기록에 합치기</label>
    <label><input type="radio" name="mode" value="replace"> 현재 기록을 지우고 교체</label>
    <div style="display:flex;gap:6px;justify-content:flex-end"><button onclick="$('dlg').close()">취소</button><button class="pri" onclick="doImport()">불러오기</button></div></div>`;
  d.showModal();
}
function doImport(){
  const f=$('file').files[0];const pt=$('paste').value.trim();
  if(!f&&!pt)return toast('파일을 선택하거나 코드를 붙여넣으세요');
  const mode=document.querySelector('input[name=mode]:checked').value;
  const run=txt=>{
    try{
      const o=JSON.parse(txt);
      if(!o.kids||!o.skills||!o.rec)throw 0;
      if(mode==='replace'){S=o}
      else{
        const idMap={};
        for(const k of o.kids){
          const ex=S.kids.find(x=>x.id===k.id||(x.name===k.name&&x.bu===(k.bu||1)));
          if(ex)idMap[k.id]=ex.id;else{S.kids.push({...k});idMap[k.id]=k.id}
        }
        for(const s of o.skills)if(!S.skills.includes(s))S.skills.push(s);
        for(const d in o.rec)for(const k in o.rec[d]){
          const nk=idMap[k]||k;
          S.rec[d]=S.rec[d]||{};S.rec[d][nk]=Object.assign({},S.rec[d][nk],o.rec[d][k]);
        }
      }
      for(const k of S.kids)if(!k.bu)k.bu=1;if(!S.bu)S.bu=1;if(!kidsOf().find(k=>k.id===S.cur))S.cur=kidsOf()[0]?.id;
      save();$('dlg').close();render();toast('불러왔어요');
    }catch(e){toast('올바른 백업 파일이 아니에요')}
  };
  if(pt)run(pt);else{const r=new FileReader();r.onload=()=>run(r.result);r.readAsText(f)}
}

/* 타이머 */
const PRE=[10,20,30,60,120];
let tSet=30,tLeft=30,tId=null,tEnd=0,actx;
function fmt(n){n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function tDraw(cls){const d=$('tdisp');d.textContent=fmt(tLeft);d.className='t '+(cls||'');
  $('tpre').innerHTML=PRE.map(x=>`<button class="${x===tSet?'on':''}" onclick="tPick(${x})">${x>=60?x/60+'분':x+'초'}</button>`).join('')+`<button onclick="tCustom()">직접</button>`;
  $('tgo').textContent=tId?'⏸ 멈춤':'▶ 시작'}
function tPick(x){if(tId)return;tSet=tLeft=x;tDraw()}
function tCustom(){if(tId)return;askText('초 단위로 입력',tSet,x=>{const v=parseInt(x);if(v>0){tSet=tLeft=v;tDraw()}})}
function beep(n){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
    o.frequency.value=880;const t=actx.currentTime+i*.25;g.gain.setValueAtTime(.3,t);g.gain.setValueAtTime(0,t+.18);o.start(t);o.stop(t+.2)}}catch(e){}}
function timerToggle(){
  if(tId){clearInterval(tId);tId=null;tDraw();return}
  if(tLeft<=0)tLeft=tSet;
  beep(0);tEnd=Date.now()+tLeft*1000;let last=Math.ceil(tLeft);
  tId=setInterval(()=>{tLeft=(tEnd-Date.now())/1000;const c=Math.ceil(tLeft);
    if(c<=3&&c>0&&c!==last){beep(1)}last=c;
    if(tLeft<=0){clearInterval(tId);tId=null;tLeft=0;tDraw('end');beep(3);if(navigator.vibrate)navigator.vibrate([300,100,300]);toast('⏰ 끝!')}
    else tDraw('run')},100);
  tDraw('run')}
function timerReset(){clearInterval(tId);tId=null;tLeft=tSet;tDraw()}

load();
$('date').value=today();
$('date').onchange=render;
$('dsel').onchange=function(){if(this.value){$('date').value=this.value;render()}};
render();tDraw();
</script>
