# main 에 코드가 올라오거나 Actions 화면에서 직접 실행하면
# Windows(.exe)와 Mac(.dmg) 설치 파일을 만들어 Releases 에 올립니다.
# 릴리스 이름(v0.1.0 등)은 package.json 의 version 을 따릅니다.
# 같은 버전으로 다시 올리면 그 릴리스의 설치 파일이 새것으로 바뀝니다.
name: 설치 파일 만들기

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Windows 설치 파일
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Mac 설치 파일
        if: runner.os == 'macOS'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 훈씨노트 v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            ## 다운로드
            - **Windows**: `HoonssiNote-Setup-${{ steps.ver.outputs.version }}.exe`
            - **Mac**: `HoonssiNote-${{ steps.ver.outputs.version }}.dmg`

            처음 실행할 때 경고가 뜨면
            - Windows: "추가 정보" → "실행"
            - Mac: 앱을 우클릭 → "열기"
